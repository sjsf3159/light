name: 自动同步上游代码

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间 8:00 自动检查并同步一次
  workflow_dispatch: # 支持在 Actions 页面手动随时点击运行

concurrency:
  group: upstream-sync
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_REPO: byJoey/cfnew
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main
  GENERATED_FILE: 少年你相信光吗

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 main 分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 合并上游并直接推送 main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config core.quotePath false
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch origin "${TARGET_BRANCH}" --no-tags
          git fetch upstream "${UPSTREAM_BRANCH}" --no-tags
          git switch -C "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"

          # 上游没有新提交时直接结束，避免创建空提交。
          if git diff --quiet HEAD "upstream/${UPSTREAM_BRANCH}"; then
            echo '上游没有新的变化。'
            exit 0
          fi

          if ! git merge --no-edit --no-ff "upstream/${UPSTREAM_BRANCH}"; then
            # 该文件是由 obfuscate.yml 根据“明文源吗”自动生成的混淆产物。
            # 它不参与 Pages 部署；保留当前 main 版本，源文件合并后由混淆工作流重新生成。
            mapfile -d '' conflict_files < <(git diff --name-only --diff-filter=U -z)
            if [[ ${#conflict_files[@]} -eq 1 && "${conflict_files[0]}" == "${GENERATED_FILE}" ]]; then
              echo "仅 ${GENERATED_FILE} 发生冲突，保留 main 版本并继续推送。"
              git checkout --ours -- "${GENERATED_FILE}"
              git add -- "${GENERATED_FILE}"
              git commit --no-edit -m 'Merge upstream while preserving generated file'
            else
              git merge --abort || true
              echo '上游存在非生成文件的合并冲突，已停止推送：' >&2
              printf '%s\n' "${conflict_files[@]}" >&2
              exit 1
            fi
          fi

          git push origin "HEAD:${TARGET_BRANCH}"
          echo "已将上游 ${UPSTREAM_REPO}:${UPSTREAM_BRANCH} 直接推送到 ${TARGET_BRANCH}。"
