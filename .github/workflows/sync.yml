name: 自动同步上游代码

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间 8:00 自动检查并同步一次
  workflow_dispatch: # 支持在 Actions 页面手动随时点击运行

concurrency:
  group: upstream-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: byJoey/cfnew
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: sync/upstream-main
  GENERATED_FILE: 少年你相信光吗

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 合并上游代码并推送同步分支
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config core.quotePath false
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" --no-tags

          # 上游没有新提交时直接结束，避免创建空 PR。
          if git diff --quiet HEAD "upstream/${UPSTREAM_BRANCH}"; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo '上游没有新的变化。'
            exit 0
          fi

          git checkout -B "${SYNC_BRANCH}" origin/main
          if ! git merge --no-edit --no-ff "upstream/${UPSTREAM_BRANCH}"; then
            # 该文件是由 obfuscate.yml 根据“明文源吗”自动生成的混淆产物。
            # 它不参与 Pages 部署；保留 Fork 版本，待源文件合并后由混淆工作流重新生成。
            mapfile -d '' conflict_files < <(git diff --name-only --diff-filter=U -z)
            if [[ ${#conflict_files[@]} -eq 1 && "${conflict_files[0]}" == "${GENERATED_FILE}" ]]; then
              echo "仅 ${GENERATED_FILE} 发生冲突，保留 Fork 版本并继续创建同步 PR。"
              git checkout --ours -- "${GENERATED_FILE}"
              git add -- "${GENERATED_FILE}"
              git commit --no-edit -m 'Merge upstream while preserving generated file'
            else
              git merge --abort || true
              echo '上游存在非生成文件的合并冲突，请手动处理：' >&2
              printf '%s\n' "${conflict_files[@]}" >&2
              exit 1
            fi
          fi

          git push --force-with-lease origin "${SYNC_BRANCH}"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

      - name: 创建或更新 Pull Request
        if: steps.sync.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          existing_pr=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${SYNC_BRANCH}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "${existing_pr}" ]]; then
            echo "已有开放的同步 PR #${existing_pr}，不重复创建。"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${SYNC_BRANCH}" \
              --title '同步上游代码' \
              --body "此 PR 由 GitHub Actions 自动创建，用于同步 ${UPSTREAM_REPO}:${UPSTREAM_BRANCH}。文件 ${GENERATED_FILE} 是由明文源文件自动生成的混淆产物，本次同步保留 Fork 版本；合并源文件后，obfuscate 工作流会重新生成它。"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
