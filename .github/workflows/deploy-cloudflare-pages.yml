name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - '明文源吗'
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: '部署方式：hook 触发 Pages 构建，api 直接上传部署'
        required: true
        default: hook
        type: choice
        options:
          - hook
          - api

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  # push 默认使用 hook；手动运行时可选择 hook 或 api。
  DEPLOY_MODE: ${{ inputs.deploy_mode || 'hook' }}
  PAGES_BRANCH: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Pages Worker 文件
        run: |
          set -euo pipefail
          test -s '明文源吗'
          rm -rf .cloudflare-pages
          mkdir -p .cloudflare-pages
          cp '明文源吗' .cloudflare-pages/_worker.js
          test -s .cloudflare-pages/_worker.js

      - name: 通过 Deploy Hook 触发 Cloudflare Pages 构建
        if: env.DEPLOY_MODE == 'hook'
        env:
          CF_PAGES_DEPLOY_HOOK_URL: ${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "${CF_PAGES_DEPLOY_HOOK_URL}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"branch\":\"${PAGES_BRANCH}\",\"commit_hash\":\"${GITHUB_SHA}\"}" \
            "${CF_PAGES_DEPLOY_HOOK_URL}"
          echo 'Cloudflare Pages Deploy Hook 已接受请求。'

      - name: 通过 Wrangler API 直接部署 Pages
        if: env.DEPLOY_MODE == 'api'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CF_PAGES_PROJECT_NAME}"
          npx --yes wrangler@latest pages deploy .cloudflare-pages \
            --project-name "${CF_PAGES_PROJECT_NAME}" \
            --branch "${PAGES_BRANCH}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${GITHUB_SHA}: ${GITHUB_REF_NAME}" \
            --no-bundle
