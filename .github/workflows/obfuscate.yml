name: Generate and Obfuscate Worker Script

on:
  # 源文件发生变化时立即生成。
  push:
    branches:
      - '**'
    paths:
      - '明文源吗'
  # 每天检查一次，作为失败重试和状态修复兜底。
  schedule:
    - cron: '30 0 * * *' # 每天北京时间 8:30
  # 上游同步工作流完成后检查源文件是否需要重新混淆。
  workflow_run:
    workflows:
      - 自动同步上游代码
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: obfuscate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-obfuscate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_run 需要使用触发它的同步提交，而不是默认分支的旧快照。
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Check whether obfuscation is needed
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          test -s '明文源吗'

          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' || "${GITHUB_EVENT_NAME}" == 'push' ]]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source_commit=$(git log -1 --format='%H' -- '明文源吗')
          generated_commit=$(git log -1 --format='%H' -- '少年你相信光吗' || true)

          # 若源文件提交已包含在最近一次混淆产物提交中，则跳过重复生成。
          if [[ -n "${generated_commit}" ]] && git merge-base --is-ancestor "${source_commit}" "${generated_commit}"; then
            echo '源文件没有新变化，跳过本次混淆。'
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          else
            echo '源文件比混淆产物更新，需要重新生成。'
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Obfuscator
        if: steps.gate.outputs.should_run == 'true'
        run: npm install javascript-obfuscator

      - name: Obfuscate from local source file
        if: steps.gate.outputs.should_run == 'true'
        run: |
          cat > obfuscate.js << 'EOF'
          const JavaScriptObfuscator = require('javascript-obfuscator');
          const fs = require('fs');
          const path = require('path');
          const sourceFileName = '明文源吗';
          const outputFileName = '少年你相信光吗';
          const sourceFilePath = path.join(process.cwd(), sourceFileName);
          if (!fs.existsSync(sourceFilePath)) {
            console.error('错误：在路径 ' + sourceFilePath + ' 未找到源文件。');
            process.exit(1);
          }
          const originalCode = fs.readFileSync(sourceFilePath, 'utf8');
          if (!originalCode || originalCode.trim().length === 0) {
            console.error('错误：源文件为空。');
            process.exit(1);
          }
          const obfuscationOptions = {
            compact: true,
            controlFlowFlattening: false,
            controlFlowFlatteningThreshold: 0,
            deadCodeInjection: false,
            stringArray: true,
            stringArrayEncoding: ['base64'],
            stringArrayThreshold: 1.0,
            stringArrayRotate: true,
            stringArrayShuffle: true,
            stringArrayWrappersCount: 2,
            stringArrayWrappersChainedCalls: false,
            stringArrayWrappersParametersMaxCount: 3,
            renameGlobals: true,
            identifierNamesGenerator: 'mangled-shuffled',
            identifiersPrefix: '',
            renameProperties: false,
            renamePropertiesMode: 'safe',
            ignoreImports: false,
            target: 'browser',
            numbersToExpressions: false,
            simplify: false,
            splitStrings: true,
            splitStringsChunkLength: 1,
            transformObjectKeys: false,
            unicodeEscapeSequence: true,
            selfDefending: false,
            debugProtection: false,
            debugProtectionInterval: 0,
            disableConsoleOutput: false,
            domainLock: []
          };
          const obfuscatedCode = JavaScriptObfuscator.obfuscate(originalCode, obfuscationOptions).getObfuscatedCode();
          fs.writeFileSync(path.join(process.cwd(), outputFileName), obfuscatedCode, 'utf8');
          console.log('已生成 ' + outputFileName + '。');
          EOF
          node obfuscate.js

      - name: Commit and push the obfuscated file
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add '少年你相信光吗'
          if git diff --staged --quiet; then
            echo '混淆文件没有变化，无需提交。'
          else
            git commit -m '部署用这个'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
